<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kingdom Casino: The Royal Grind</title>
<style>
:root{--bg:#0b0907;--panel:#1a1410;--panel2:#120e0a;--line:#423225;--gold:#cca43b;--muted:#bfae99;--red:#a83232;--green:#2e7d32}*{box-sizing:border-box}body{margin:0;padding:20px;background:radial-gradient(circle at 50% -10%,#302014,#0b0907 55%);color:#e6ded4;font:16px Georgia,serif}button{font:inherit;cursor:pointer}.app{max-width:1200px;margin:auto;background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 0 40px #000}.header{text-align:center;padding:20px;background:#090705;border-bottom:2px solid var(--line)}h1{margin:0;color:var(--gold);letter-spacing:4px;font-size:clamp(1.5rem,4vw,2.2rem)}.tabs{display:flex;background:#120e0a;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:14px 8px;background:0;border:0;color:#7c6b5c;text-transform:uppercase;font-weight:bold}.tabs button.active,.tabs button:hover{color:var(--gold);background:#1c1511}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 25px;background:#090705;border-bottom:1px solid var(--line)}.gold{color:var(--gold)}.view{padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:18px}.table-card{min-height:210px;display:flex;flex-direction:column}.table-card h3{margin:0 0 10px;color:var(--gold)}.desc{color:var(--muted);line-height:1.45;flex:1}.btn{width:100%;padding:11px 16px;border:0;border-radius:4px;background:var(--gold);color:#000;font-weight:bold;text-transform:uppercase}.btn:disabled{background:#2b221a;color:#5e4c3e;cursor:not-allowed}.modal{display:none;position:fixed;inset:0;z-index:5;background:#050403f5;align-items:center;justify-content:center;padding:14px}.arena{display:grid;grid-template-columns:110px minmax(0,1fr);width:min(950px,100%);height:min(720px,92vh);background:#15100c;border:2px solid var(--line);border-radius:8px;overflow:hidden}.side{background:#090705;border-right:1px solid var(--line);padding:18px 10px;text-align:center}.side h4{margin:0 0 14px;color:#7c6b5c;text-transform:uppercase;font-size:.75rem;letter-spacing:1px}.rack{display:grid;gap:10px}.coin{width:58px;height:58px;border-radius:50%;border:3px double #e6ded4;background:radial-gradient(circle,#9e9589,#4a4137);color:#fff;font-weight:bold;margin:auto}.board{padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;text-align:center}.board h2,.board h3{color:var(--gold)}.actions{display:flex;gap:10px;width:min(450px,100%);margin-top:18px}.actions .btn{flex:1}.danger{background:#421d1d;color:#fff}.neutral{background:#423225;color:#fff}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(500px,100%);margin-top:18px}.mine-grid{display:grid;grid-template-columns:repeat(5,48px);gap:6px;margin:14px auto}.mine{height:48px;background:#2b2118;border:1px solid var(--line);color:#fff;border-radius:4px}.status{min-height:26px;color:var(--muted)}.slots{display:flex;gap:5px}.slot{width:32px;height:32px;display:grid;place-items:center;border:1px dashed #543d2b}.slot.on{border-color:var(--gold)}li{margin:10px 0;line-height:1.45}@media(max-width:620px){body{padding:0}.bar{padding:12px;flex-direction:column;align-items:flex-start}.tabs button{font-size:.7rem}.view{padding:16px}.arena{grid-template-columns:74px minmax(0,1fr)}.side{padding:14px 5px}.coin{width:48px;height:48px;font-size:.75rem}.board{padding:16px}.actions,.choices{flex-direction:column}.actions{display:flex}.choices{display:grid}}
</style>
</head>
<body>
<div class="app"><header class="header"><h1>👑 KINGDOM CASINO 👑</h1></header>
<nav class="tabs"><button class="active" data-view="tables">Tables</button><button data-view="relics">Relic Vault</button><button data-view="shop">Merchant Stall</button><button data-view="guide">Index Guide</button></nav>
<div class="bar"><div>Loadout <span id="slots" class="slots"></span></div><strong>Silver Vault: <span id="balance" class="gold"></span></strong></div>
<section id="tables" class="view"><div id="tables-grid" class="grid"></div></section>
<section id="relics" class="view" hidden><h2 class="gold">The Artifact Sanctum</h2><div id="relic-grid" class="grid"></div></section>
<section id="shop" class="view" hidden><h2 class="gold">Royal Exchange</h2><div id="shop-grid" class="grid"></div></section>
<section id="guide" class="view" hidden><h2 class="gold">Grand Ledger</h2><ul id="guide-list"></ul></section></div>
<div id="modal" class="modal"><div class="arena"><aside class="side"><h4>Bet Rack</h4><div class="rack"><button class="coin" data-bet="10">10</button><button class="coin" data-bet="50">50</button><button class="coin" data-bet="100">100</button></div><hr><h4>Active Bet</h4><strong id="wager" class="gold">0</strong></aside><main id="board" class="board"></main></div></div>
<script>
const games=[['Catapult Siege','🧱','Choose a target lane.'],["Dragon's Lair",'🐉','Dig safe blocks and cash out.'],["Knight's Gambit",'⚔️','Beat the dealer hand.'],["The Griffin's Ascent",'🦅','Climb, then dismount before the crash.'],['The Drawbridge Cross','🌉','Cross safe bridge tiers.'],['Royal Dice Duel','🎲','Roll higher than the champion.'],['Sovereign Slots','🎰','Spin three royal reels.'],["Wizard's Towers",'🧙‍♂️','Find the tower holding the spellbook.'],['Solar Eclipse','☀️','Predict the next card direction.'],['Forbidden Forest','🌲','Choose safe paths through the forest.'],["The Jester's Coin",'🪙','Call the next coin face.'],["Oracle's Vision",'🔮','Predict the basin color.']];
const relics=[['fire','🔥','Hearth-Knight Ember'],['water','💧','Citadel Hydro-Core'],['earth','🏔️','Stonewall Crest'],['gold','🪙','Midas Hand Nugget']];
let balance=Number(localStorage.kc_balance??1000), slots=Number(localStorage.kc_slots??1), equipped=JSON.parse(localStorage.kc_equipped||'[]'), stamina=JSON.parse(localStorage.kc_stamina||'{}');
let round=null;
const $=id=>document.getElementById(id); const save=()=>{localStorage.kc_balance=balance;localStorage.kc_slots=slots;localStorage.kc_equipped=JSON.stringify(equipped);localStorage.kc_stamina=JSON.stringify(stamina)};
function render(){ $('balance').textContent=balance.toLocaleString();$('slots').innerHTML=Array.from({length:5},(_,i)=>`<span class="slot ${i<slots?'on':''}">${i<slots?(equipped[i]||'•'):'🔒'}</span>`).join('');
$('tables-grid').innerHTML=games.map((g,i)=>`<article class="card table-card"><h3>${g[1]} ${g[0]}</h3><p class="desc">${g[2]}</p><p>Stamina: <span class="gold">${stamina[i]??10}/10</span></p><button class="btn" data-play="${i}" ${(stamina[i]??10)<1?'disabled':''}>Approach Seat</button></article>`).join('');
$('relic-grid').innerHTML=relics.map(r=>`<article class="card"><h3>${r[1]} ${r[2]}</h3><p class="desc">Equip this relic to add a small round effect.</p><button class="btn ${equipped.includes(r[0])?'neutral':''}" data-relic="${r[0]}">${equipped.includes(r[0])?'Unequip':'Equip'}</button></article>`).join('');
$('shop-grid').innerHTML=`<article class="card"><h3>🔓 Expand Relic Chamber</h3><p class="desc">Increase active relic capacity.</p><button class="btn" data-buy="slot" ${slots>=5||balance<400?'disabled':''}>Buy for 400</button></article><article class="card"><h3>🔋 Fortified Reserve</h3><p class="desc">Increase every table's stamina capacity.</p><button class="btn" disabled>Coming soon</button></article>`;
$('guide-list').innerHTML=games.map(g=>`<li><strong>${g[1]} ${g[0]}:</strong> ${g[2]} Each round consumes one stamina point and can be replayed after reset.</li>`).join(''); save();}
function resetRound({refund=false,close=false}={}){if(!round)return;if(refund)balance+=round.wager;round.wager=0;round.active=false;round.phase='idle';round.grid=[];$('wager').textContent='0';if(close){$('modal').style.display='none';round=null}else renderBoard();render();}
function finish(won,margin=0.1,message='Round complete.'){if(!round)return;const payout=won?Math.floor(round.wager*(1+margin))+(equipped.includes('gold')?1:0):0;balance+=payout;round.wager=0;round.active=false;round.phase='result';$('wager').textContent='0';$('board').innerHTML=`<h2 class="${won?'gold':''}">${won?'Yield Secured':'Defeat'}</h2><p>${message}</p><p>${won?'Returned to vault: '+payout:'The wager was collected by the Crown.'}</p><div class="actions"><button class="btn" data-reset>New Round</button><button class="btn neutral" data-leave>Leave Table</button></div>`;render();}
function openGame(id){if((stamina[id]??10)<1)return;round={id,wager:0,active:false,phase:'idle',grid:[]};$('modal').style.display='flex';renderBoard()}
function renderBoard(){if(!round)return;const g=games[round.id];if(round.phase==='idle'){$('board').innerHTML=`<h2>${g[1]} ${g[0]}</h2><p>${g[2]}</p><p>Staged stake: <strong class="gold">${round.wager}</strong></p><div class="actions"><button class="btn neutral" data-leave>Leave</button><button class="btn danger" data-clear>Clear Bet</button><button class="btn" data-start ${round.wager?'':'disabled'}>Play Hand</button></div>`}else if(round.phase==='play')renderPlay();}
function start(){if(!round||round.wager<1)return;round.active=true;round.phase='play';stamina[round.id]=(stamina[round.id]??10)-1;renderPlay();render();}
function renderPlay(){const id=round.id;if(id===1){round.grid=round.grid.length?round.grid:Array.from({length:25},()=>Math.random()<.2);$('board').innerHTML=`<h2>🐉 Dragon's Lair</h2><p>Safe digs add 1%. Cash out at any time.</p><div class="mine-grid">${round.grid.map((mine,i)=>`<button class="mine" data-mine="${i}">?</button>`).join('')}</div><button class="btn" data-cashout>Secure Cashout</button>`}else if(id===2){$('board').innerHTML=`<h2>⚔️ Knight's Gambit</h2><p>Your power: ${round.player??(round.player=10+Math.floor(Math.random()*10))}</p><div class="actions"><button class="btn" data-hit>Hit</button><button class="btn neutral" data-stand>Stand</button></div>`}else if(id===0){$('board').innerHTML=`<h2>🧱 Catapult Siege</h2><p>Pick a target.</p><div class="choices"><button class="btn" data-choice="0">Left Moat</button><button class="btn" data-choice="1">Center Gate</button><button class="btn" data-choice="2">Right Court</button></div>`}else{$('board').innerHTML=`<h2>${games[id][1]} ${games[id][0]}</h2><p>Choose an outcome, then the table resolves the round.</p><div class="choices"><button class="btn" data-choice="0">Option A</button><button class="btn" data-choice="1">Option B</button><button class="btn" data-choice="2">Option C</button></div>`}}
function resolveChoice(choice){if(!round?.active)return;if(round.id===0&&choice===1){finish(false,-.8,'The center gate trap triggered.');return}finish(Math.random()>.38, games[round.id][0]==='The Griffin\'s Ascent'?0.12:0.08,'The table has resolved your choice.');}
$('modal').addEventListener('click',e=>{const t=e.target;if(t.dataset.bet){if(!round||round.active||balance<+t.dataset.bet)return;balance-=+t.dataset.bet;round.wager+=+t.dataset.bet;$('wager').textContent=round.wager;renderBoard();render();}if(t.dataset.play!==undefined)openGame(+t.dataset.play);if(t.dataset.start)start();if(t.dataset.leave)resetRound({refund:true,close:true});if(t.dataset.clear)resetRound({refund:true});if(t.dataset.reset){round.player=undefined;round.grid=[];resetRound();}if(t.dataset.choice)resolveChoice(+t.dataset.choice);if(t.dataset.cashout)finish(true,Math.max(.01,round.grid.filter(Boolean).length*.01),'You secured the discovered margin.');if(t.dataset.mine!==undefined){const i=+t.dataset.mine;if(round.grid[i])finish(false,0,'A dragon was awakened.');else{t.textContent='💎';t.disabled=true;round.grid[i]=false;round.grid.push(false);renderPlay();}}if(t.dataset.hit){round.player+=(2+Math.floor(Math.random()*10));if(round.player>21)finish(false,0,'Your hand busted.');else renderPlay()}if(t.dataset.stand)finish(Math.random()>.4,.1,'The dealer has revealed their hand.');});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==b.dataset.view)});document.addEventListener('click',e=>{if(e.target.dataset.relic){const id=e.target.dataset.relic;if(equipped.includes(id))equipped=equipped.filter(x=>x!==id);else if(equipped.length<slots)equipped.push(id);render()}if(e.target.dataset.buy==='slot'&&balance>=400){balance-=400;slots++;render()}});render();
</script></body></html>
